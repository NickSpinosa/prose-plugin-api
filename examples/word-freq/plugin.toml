id = "word-freq"
name = "WordFreq"
version = "0.2.0"
api = "0.1.0"
description = "Lists the most used words in a document and fixes doubled words."
authors = ["Prose"]
license = "MIT OR Apache-2.0"
# :WordFreqFix edits the document it is run on. :WordFreq only reads it.
permissions = ["edit-documents"]
events = []

[settings.ignore]
kind = "text-list"
default = ["the", "and", "a", "to", "of", "in", "was", "he", "she", "it", "that", "her", "his", "i"]
help = "Words left out of the list."

[settings.min_length]
title = "Shortest word"
kind = "integer"
default = 3
min = 1
max = 20
help = "Words shorter than this are left out."

[settings.count]
kind = "integer"
default = 10
min = 1
max = 100
help = "How many words to list when :WordFreq is run without a number."

[settings.allow_doubled]
title = "Words that may double"
kind = "text-list"
default = ["had", "that", "is"]
help = "Words :WordFreqFix leaves doubled, like \"had had\"."
